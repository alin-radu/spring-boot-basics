#
# APP settings
#
spring.application.name=sprint-boot-rest-security-basics
spring.main.banner-mode=off
#server.servlet.context-path=/api // will throw error with authorization
#
# Security Settings
#
spring.security.user.name=dev
spring.security.user.password=test1234
#
# DB connection info
#
spring.datasource.url=jdbc:mysql://localhost:3306/employee_directory
spring.datasource.username=devuser
spring.datasource.password=dev2024!
#
# Actuator settings
#
management.endpoints.web.exposure.include=*
