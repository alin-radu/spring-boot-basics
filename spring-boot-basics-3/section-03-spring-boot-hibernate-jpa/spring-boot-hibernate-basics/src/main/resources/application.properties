#
# APP settings
#
spring.application.name=spring-boot-hibernate-basics
spring.main.banner-mode=off
#
# DB connection info
#
spring.datasource.url=jdbc:mysql://localhost:3306/student_tracker
spring.datasource.username=devuser
spring.datasource.password=dev2024!
#
# configure JPA/Hibernate to auto create tables
# create will drop all tables from the DB and after that wil create new ones
# NOT RECOMMENDED for real projects, use instead SQL scripts
spring.jpa.hibernate.ddl-auto=update
#
# Logs
#
# default value is INFO
logging.level.root=WARN

# log SQL statements
logging.level.org.hibernate.SQL=DEBUG
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# log values for SQL statements
logging.level.org.hibernate.orm.jdbc.bind=TRACE

